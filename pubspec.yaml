name: flutter_nivasshub
description: "NivassHub - Smart Gated Community Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---------------------------------------------------------------------------
  # State Management
  # ---------------------------------------------------------------------------
  provider: ^6.1.5

  # ---------------------------------------------------------------------------
  # Network
  # ---------------------------------------------------------------------------
  dio: ^5.11.0
  connectivity_plus: ^7.0.0

  # ---------------------------------------------------------------------------
  # Local Storage
  # ---------------------------------------------------------------------------
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.0.0-beta.4

  # ---------------------------------------------------------------------------
  # Image
  # ---------------------------------------------------------------------------
  cached_network_image: ^3.4.1

  # ---------------------------------------------------------------------------
  # URL Launcher
  # ---------------------------------------------------------------------------
  url_launcher: ^6.3.2

  # ---------------------------------------------------------------------------
  # Loading
  # ---------------------------------------------------------------------------
  shimmer: ^3.0.0

  # ---------------------------------------------------------------------------
  # SVG
  # ---------------------------------------------------------------------------
  flutter_svg: ^2.2.0

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------
  intl: ^0.20.3
  equatable: ^2.0.7
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700