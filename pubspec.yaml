name: flutter_nivasshub
description: "NivassHub - Smart Gated Community Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8

  # ---------------------------------------------------------------------------
  # Media & File Handling
  # ---------------------------------------------------------------------------
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  permission_handler: ^11.3.1

  # In-app KYC camera capture: manual front/back switch plus an in-app
  # preview/retake step, instead of delegating to the OS camera app.
  #
  # Pinned below 0.11 deliberately: `camera` 0.11.x defaults Android to
  # `camera_android_camerax`, whose bundled camera-core 1.5.3 fails to
  # compile against this project's Gradle/AGP toolchain ("class file for
  # androidx.concurrent.futures.CallbackToFutureAdapter not found" in
  # SurfaceRequest, verified independent of app-module dependencies). 0.10.x
  # uses the older Camera2-based `camera_android`, which builds cleanly and
  # exposes the exact same Dart API this screen uses.
  camera: ^0.10.6

  # `image_picker` can only return photos/videos — it physically cannot
  # surface a PDF, which KYC document upload requires. Both plugins are
  # hidden behind `FilePickerServiceBase` so no provider imports either.
  # ^13 (not ^8) is required: file_picker 8.x pins win32 ^5.x while
  # share_plus ^13.3.0 pins win32 ^6.0.1, and the two cannot co-resolve.
  file_picker: ^13.1.0

  # ---------------------------------------------------------------------------
  # State Management
  # ---------------------------------------------------------------------------
  provider: ^6.1.5

  # ---------------------------------------------------------------------------
  # Networking
  # ---------------------------------------------------------------------------
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # ---------------------------------------------------------------------------
  # Local Storage
  # ---------------------------------------------------------------------------
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # ---------------------------------------------------------------------------
  # UI
  # ---------------------------------------------------------------------------
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------
  intl: ^0.20.3
  equatable: ^2.0.7
  collection: ^1.19.1

  # ---------------------------------------------------------------------------
  # URL Launcher
  # ---------------------------------------------------------------------------
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.1
  smart_auth: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/kyc/cities/
    - assets/icons/
    - assets/json/
    - assets/icons/settings/
    - assets/icons/quick_actions/
    - assets/icons/quick_actions/homequick_actions/
    - assets/json/notices/
    - assets/json/location/
    - assets/icons/profile/addbio.png
    - assets/icons/profile/address(profile).png
    - assets/icons/profile/area(addaddress).png
    - assets/icons/profile/block.png
    - assets/icons/profile/briefcase.png
    - assets/icons/profile/house.png
    - assets/icons/profile/landmark(addaddress).png
    - assets/icons/profile/street(addaddress).png
    - assets/icons/profile/wing(addaddress).png
  # 
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700