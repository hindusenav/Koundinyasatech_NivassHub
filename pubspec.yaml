name: flutter_nivasshub
description: "NivassHub - Smart Gated Community Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---------------------------------------------------------------------------
  # Media & File Handling
  # ---------------------------------------------------------------------------
  image_picker: ^1.1.2
  share_plus: ^10.0.0

  # ---------------------------------------------------------------------------
  # State Management
  # ---------------------------------------------------------------------------
  provider: ^6.1.5

  # ---------------------------------------------------------------------------
  # Networking
  # ---------------------------------------------------------------------------
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # ---------------------------------------------------------------------------
  # Local Storage
  # ---------------------------------------------------------------------------
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1

  # ---------------------------------------------------------------------------
  # UI
  # ---------------------------------------------------------------------------
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.1

  # ---------------------------------------------------------------------------
  # Utilities
  # ---------------------------------------------------------------------------
  intl: ^0.20.3
  equatable: ^2.0.7
  collection: ^1.19.1

  # ---------------------------------------------------------------------------
  # URL Launcher
  # ---------------------------------------------------------------------------
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/json/
    - assets/icons/quick_actions/
    - assets/json/notices/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700